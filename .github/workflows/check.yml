name: Validate RFP Builder
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/rfp-builder/scripts/runtime/package-lock.json
      - run: npm run setup
      - run: npm test
      - run: npm run check
